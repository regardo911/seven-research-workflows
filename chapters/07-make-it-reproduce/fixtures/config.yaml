# Fixture config for the dry run. Same five categories as the book's config.yaml;
# the paths point at the Chapter 5 fixtures so the DAG has real files to resolve
# against. Paths are relative to this file's directory, which is what -d sets.
run:
  name: dryrun
  note: "fixture: proves the DAG resolves, with no conda and no R"

paths:
  counts:      ../../05-reconcile-your-cleaning/fixtures/cohort2_counts.tsv
  samplesheet: ../../05-reconcile-your-cleaning/fixtures/cohort_2_v3.csv
  annotation:  ../../05-reconcile-your-cleaning/fixtures/cohort2_counts.tsv
  outdir:      runs/dryrun

design:
  condition_column: condition
  reference_level:  ctrl
  contrast:         "treat vs ctrl"
  covariates:       [batch]
  controls:         [POS_CTRL_1, POS_CTRL_2]

thresholds:
  min_count_per_gene:   10
  min_samples_expressed: 3
  padj_cutoff:          0.05
  lfc_cutoff:           1.0

seed: 42
